
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Ticket - IPL Portal</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAVIGATION BAR -->

    <nav>
        <div class="logo">🏏 IPL Portal</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Matches</a></li>
            <li><a href="booking-validation.html">Book Ticket</a></li>
            <li><a href="#">My Bookings</a></li>
            <li><a href="#">Guidelines</a></li>
        </ul>
    </nav>

    <!-- BOOKING SECTION -->

    <main class="page-content">

        <h2 class="page-title">Book Your Ticket</h2>

        <div class="grid-layout">

            <!-- LEFT SIDE: TICKET FORM -->

            <div class="form-card">

                <h3>Ticket Details</h3>

                <form id="bookingForm" novalidate>

                    <label for="nameInput">Name</label>

                    <input type="text" id="nameInput"
                        placeholder="Enter your name">

                    <span class="error-msg" id="nameError"></span>


                    <label for="ticketInput">
                        Number of Tickets (Max 10)
                    </label>

                    <input type="number" id="ticketInput"
                        value="1" min="1" max="10">

                    <span class="error-msg" id="ticketError"></span>


                    <label for="standInput">Stand</label>

                    <select id="standInput">

                        <option value="1000">General Stand (₹1000)</option>

                        <option value="2500">Premium Stand (₹2500)</option>

                        <option value="5000">VIP Stand (₹5000)</option>

                    </select>


                    <label for="venueInput">Venue</label>

                    <input type="text" id="venueInput"
                        placeholder="e.g. Wankhede Stadium">

                    <span class="error-msg" id="venueError"></span>

                </form>

            </div>


            <!-- RIGHT SIDE: BOOKING SUMMARY -->

            <div class="summary-card">

                <h3>Booking Summary</h3>

                <div class="summary-row">
                    <span>Name:</span>
                    <strong id="sumName">-</strong>
                </div>

                <div class="summary-row">
                    <span>Tickets:</span>
                    <strong id="sumTickets">1</strong>
                </div>

                <div class="summary-row">
                    <span>Stand:</span>
                    <strong id="sumStand">General Stand</strong>
                </div>

                <div class="summary-row">
                    <span>Venue:</span>
                    <strong id="sumVenue">-</strong>
                </div>

                <hr>

                <h3 class="total-amount">

                    <span>Total Amount:</span>

                    <span>₹<span id="sumTotal">1000</span></span>

                </h3>

                <button type="button" class="btn btn-primary"
                    id="bookButton">

                    Book Ticket

                </button>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        <p>&copy; 2026 IPL Ticket Booking Portal | All Rights Reserved</p>
    </footer>


    <!-- JAVASCRIPT FILE -->

    <script src="script.js"></script>

</body>

</html>
